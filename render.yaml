services:
  - type: web
    name: creatorhub-api
    runtime: docker
    dockerfilePath: ./server-php/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "5000"
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://creatorhub.netlify.app"
