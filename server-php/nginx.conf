# ===================================================
# CreatorHub Production Nginx + PHP-FPM Configuration
# ===================================================

server {
    listen 80;
    server_name api.creatorhub.local your-api-domain.com;

    # Set root to the public directory
    root /var/www/creatorhub/server-php/public;
    index index.php index.html;

    # Upload & request limits
    client_max_body_size 10M;
    charset utf-8;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Route all requests to index.php front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to FastCGI server (PHP-FPM)
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Or 127.0.0.1:9000
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;

        # FastCGI timeout settings
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    # Protect SQLite database files, dotfiles, and sensitive configuration
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.(db|sqlite|sql|log|env|json|lock)$ {
        deny all;
    }
}
